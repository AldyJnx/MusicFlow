name: musicflow_mobile
description: "MusicFlow mobile client (Flutter)."
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ^3.11.1
  flutter: ">=3.41.0"

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: 1.0.9

  # State management
  flutter_riverpod: 2.6.1
  riverpod_annotation: 2.6.1

  # Routing
  go_router: 14.8.1

  # HTTP
  dio: 5.9.2

  # Models / serialization
  freezed_annotation: 2.4.4
  json_annotation: 4.9.0

  # Storage
  flutter_secure_storage: 9.2.4
  shared_preferences: 2.5.5
  permission_handler: 12.0.3

  # Audio
  just_audio: 0.9.46
  audio_service: 0.18.18
  rxdart: 0.28.0
  path_provider: 2.1.6
  flutter_chrome_cast: 1.4.6
  google_sign_in: ^7.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: 6.0.0
  flutter_launcher_icons: 0.14.4

  # Code generation
  build_runner: 2.5.4
  freezed: 2.5.8
  json_serializable: 6.9.5
  riverpod_generator: 2.6.4
  integration_test:
    sdk: flutter

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/music-flow.png"
  adaptive_icon_background: "#10182D"
  adaptive_icon_foreground: "assets/icon/music-flow.png"

flutter:
  uses-material-design: true
  assets:
    - assets/icon/
