name: musicflow-prod

x-backend-environment: &backend-environment
  NODE_ENV: production
  PORT: 8000
  ENABLE_SWAGGER: "false"
  DATABASE_URL: postgresql://${POSTGRES_USER:?POSTGRES_USER requerido}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD requerido}@db:5432/${POSTGRES_DB:?POSTGRES_DB requerido}?schema=public
  REDIS_URL: redis://:${REDIS_PASSWORD:?REDIS_PASSWORD requerido}@redis:6379/0
  JWT_SECRET: ${JWT_SECRET:?JWT_SECRET requerido}
  JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?JWT_REFRESH_SECRET requerido}
  CORS_ORIGINS: ${CORS_ORIGINS:?CORS_ORIGINS requerido}

x-backend-build: &backend-build
  context: .
  dockerfile: apps/backend/Dockerfile

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB requerido}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER requerido}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD requerido}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - internal
    security_opt:
      - no-new-privileges:true

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command:
      [
        "redis-server",
        "--appendonly",
        "yes",
        "--requirepass",
        "${REDIS_PASSWORD:?REDIS_PASSWORD requerido}",
      ]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", 'redis-cli -a "$${REDIS_PASSWORD}" ping | grep PONG']
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 5s
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD requerido}
    networks:
      - internal
    security_opt:
      - no-new-privileges:true

  migrate:
    build:
      <<: *backend-build
      target: builder
    restart: "no"
    env_file:
      - ${MUSICFLOW_ENV_FILE:-.env.vps}
    environment:
      <<: *backend-environment
    command:
      ["pnpm", "--filter", "@musicflow/backend", "run", "prisma:migrate:deploy"]
    depends_on:
      db:
        condition: service_healthy
    networks:
      - internal
    security_opt:
      - no-new-privileges:true

  backend:
    build:
      <<: *backend-build
      target: production
    restart: unless-stopped
    init: true
    env_file:
      - ${MUSICFLOW_ENV_FILE:-.env.vps}
    environment:
      <<: *backend-environment
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    expose:
      - "8000"
    read_only: true
    tmpfs:
      - /tmp:size=256m,mode=1777
    stop_grace_period: 30s
    networks:
      - internal
      - edge
    security_opt:
      - no-new-privileges:true

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      API_DOMAIN: ${API_DOMAIN:?API_DOMAIN requerido}
      TLS_EMAIL: ${TLS_EMAIL:?TLS_EMAIL requerido}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./infra/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - edge
    security_opt:
      - no-new-privileges:true

networks:
  internal:
    internal: true
  edge:

volumes:
  postgres_data:
  redis_data:
  caddy_data:
  caddy_config:
