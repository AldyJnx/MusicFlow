name: Android Release

on:
  workflow_dispatch:
  push:
    tags: ["mobile-v*"]

jobs:
  signed-aab:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v6
      - name: Configure Java 17 for Gradle
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Create production configuration
        working-directory: apps/mobile
        env:
          API_BASE_URL: ${{ vars.MOBILE_API_BASE_URL }}
          FIREBASE_API_KEY: ${{ vars.FIREBASE_API_KEY }}
          FIREBASE_PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID }}
          FIREBASE_MESSAGING_SENDER_ID: ${{ vars.FIREBASE_MESSAGING_SENDER_ID }}
          FIREBASE_ANDROID_APP_ID: ${{ vars.FIREBASE_ANDROID_APP_ID }}
          FIREBASE_STORAGE_BUCKET: ${{ vars.FIREBASE_STORAGE_BUCKET }}
          CAST_RECEIVER_APP_ID: ${{ vars.CAST_RECEIVER_APP_ID }}
          GOOGLE_WEB_CLIENT_ID: ${{ vars.GOOGLE_WEB_CLIENT_ID }}
        run: |
          test -n "$API_BASE_URL"
          test -n "$FIREBASE_ANDROID_APP_ID"
          test -n "$GOOGLE_WEB_CLIENT_ID"
          mkdir -p config
          jq -n \
            --arg api "$API_BASE_URL" \
            --arg key "$FIREBASE_API_KEY" \
            --arg project "$FIREBASE_PROJECT_ID" \
            --arg sender "$FIREBASE_MESSAGING_SENDER_ID" \
            --arg app "$FIREBASE_ANDROID_APP_ID" \
            --arg bucket "$FIREBASE_STORAGE_BUCKET" \
            --arg cast "$CAST_RECEIVER_APP_ID" \
            --arg google "$GOOGLE_WEB_CLIENT_ID" \
            '{API_BASE_URL:$api,FIREBASE_API_KEY:$key,FIREBASE_PROJECT_ID:$project,FIREBASE_MESSAGING_SENDER_ID:$sender,FIREBASE_ANDROID_APP_ID:$app,FIREBASE_STORAGE_BUCKET:$bucket,CAST_RECEIVER_APP_ID:$cast,GOOGLE_WEB_CLIENT_ID:$google}' \
            > config/production.json
      - name: Restore upload keystore
        working-directory: apps/mobile
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64"
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/upload-keystore.jks
          printf "storePassword=%s\nkeyPassword=%s\nkeyAlias=%s\nstoreFile=../upload-keystore.jks\n" \
            "$ANDROID_STORE_PASSWORD" "$ANDROID_KEY_PASSWORD" "$ANDROID_KEY_ALIAS" \
            > android/key.properties
      - name: Build signed bundle
        working-directory: apps/mobile
        run: flutter pub get && flutter build appbundle --release --dart-define-from-file=config/production.json
      - uses: actions/upload-artifact@v6
        with:
          name: musicflow-android-aab
          path: apps/mobile/build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error
